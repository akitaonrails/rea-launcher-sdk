[package]
name = "rea-launcher-ui"
description = "Settings-window kit for the rea retro-game launchers: theme, Barlow fonts, widgets, window sizing, pad navigation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rea-launcher.workspace = true
eframe.workspace = true
jpeg-decoder.workspace = true
egui_kittest = { workspace = true, optional = true }

[dev-dependencies]
egui_kittest.workspace = true

[features]
# `rea_launcher_ui::testing`: headless GUI test helpers (egui_kittest,
# AccessKit queries and clicks, no GPU). Enable it in a launcher's
# dev-dependencies: `rea-launcher-ui = { ..., features = ["testing"] }`.
testing = ["dep:egui_kittest"]

# winit needs a windowing backend to build on Linux (host tests, and SCR's
# native Linux launcher). Windows builds are unaffected.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
# `pad::joystick`: O_NONBLOCK for /dev/input/js* (already in the tree via winit).
libc = "0.2"
