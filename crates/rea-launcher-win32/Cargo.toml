[package]
name = "rea-launcher-win32"
description = "Win32 helpers for the rea retro-game launchers: registry, process start, XInput, displays, dialogs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rea-launcher.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Test helpers for the Wine DLL-override test (`wine::tests`): a stand-in
# native DLL with a Wine builtin's name, and a program that reports which
# copy it loaded.
[[example]]
name = "d3dx9_35"
crate-type = ["cdylib"]

[[example]]
name = "dll_probe"

# The innoextract stand-in for the unpack tests (`innoextract::tests`).
[[example]]
name = "inno_child"
