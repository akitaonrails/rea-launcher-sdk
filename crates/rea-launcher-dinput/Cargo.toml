[package]
name = "rea-launcher-dinput"
description = "An in-game DirectInput 8 layer that shows an old game one virtual wheel made from the player's wheel and pedals, with steering lock and force feedback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rea_dinput"
# The DLL the launcher ships; the rlib gives the launcher `import_into`
# and the tests the pure pieces.
crate-type = ["cdylib", "rlib"]

[features]
default = ["dll"]
# The DLL's own entry points: DllMain and its exports. A launcher that links
# this crate only for `import_into` turns it off (`default-features =
# false`), since two such crates in one exe would each bring a DllMain, and
# builds the DLL itself with `--features rea-launcher-dinput/dll`.
dll = []

[dependencies]
rea-launcher.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
rea-launcher-build.workspace = true

# The stand-in game's hidden window.
[target.'cfg(windows)'.dev-dependencies.windows-sys]
workspace = true
features = ["Win32_Graphics_Gdi"]

# The stand-in for a dinput8.dll in the game's folder (Xidi's place).
[[example]]
name = "dinput8"
crate-type = ["cdylib"]
