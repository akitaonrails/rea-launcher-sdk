[package]
name = "rea-launcher"
description = "Portable core of the rea retro-game launchers: runtime folder, config, ini, patching, Wine helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sha2.workspace = true
# Unpacking downloaded archives (`download::install`): deflate only, pure Rust.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[features]
zip = ["dep:zip"]
