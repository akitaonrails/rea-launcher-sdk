[package]
name = "rea-launcher-close-hook"
description = "A WH_GETMESSAGE hook DLL that makes old games honour Alt+F4 and window close, configured per game without recompiling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rea_close_hook"
# The DLL the launcher ships; the rlib lets the launcher validate the
# configuration with the same parser.
crate-type = ["cdylib", "rlib"]

[features]
default = ["dll"]
# The DLL's own entry points: DllMain and its exports. A launcher that links
# this crate only for `import_into` turns it off (`default-features =
# false`), since two such crates in one exe would each bring a DllMain, and
# builds the DLL itself with `--features rea-launcher-close-hook/dll`.
dll = []

[dependencies]
rea-launcher.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
rea-launcher-build.workspace = true

[dev-dependencies]
rea-launcher-win32 = { path = "../rea-launcher-win32" }
