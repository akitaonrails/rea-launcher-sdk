name: launcher-ci

# Reusable checks, build and packaging for a rea launcher. A launcher's
# build.yml calls it by tag; see packaging/README.md for an example.
#
# Every caller-supplied string reaches the shell through the environment,
# never pasted into a script.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (Screamer uses ubuntu-22.04 for an older glibc).
        type: string
        default: ubuntu-24.04
      concurrency-key:
        description: >-
          Extra concurrency key; give each call a different one when a
          workflow calls launcher-ci more than once, or they cancel each other.
        type: string
        default: ""
      rust-toolchain:
        description: rustup toolchain (e.g. stable, 1.95.0).
        type: string
        default: stable
      rust-target:
        description: Cross target for clippy and the release build; empty builds for the host.
        type: string
        default: i686-pc-windows-gnu
      apt-packages:
        description: Extra Ubuntu packages, space-separated.
        type: string
        default: gcc-mingw-w64-i686 lld zip unzip
      apt-i386:
        description: Run dpkg --add-architecture i386 first (for :i386 packages, as CMR3's vkBasalt build).
        type: boolean
        default: false
      submodules:
        description: actions/checkout submodules (false, true, recursive).
        type: string
        default: "false"
      shell-syntax:
        description: Globs of POSIX sh scripts checked with sh -n (missing ones are skipped).
        type: string
        default: linux/*-play packaging/*.sh packaging/appimage/AppRun packaging/appimage/*.sh sdk/packaging/*.sh sdk/rea-play.sh
      shell-tests:
        description: >-
          Globs of shell test scripts, space-separated, each run with sh
          (dash on Ubuntu); a failing script fails the job. Globs that match
          nothing are skipped.
        type: string
        default: linux/tests/*.sh packaging/tests/*.sh
      shell-tests-skip:
        description: >-
          Shell patterns (space-separated) for test paths not to run, e.g.
          end-to-end tests that need the game or a dev kit.
        type: string
        default: "*e2e*"
      clippy-args:
        description: Extra cargo clippy arguments (empty lints only the library and binaries).
        type: string
        default: --all-targets
      wine-tests:
        description: >-
          Also run cargo test for rust-target under Wine, headless, with the
          vendored sdk/scripts/wine-test (installs Wine and the matching MinGW).
        type: boolean
        default: false
      wine-test-args:
        description: Arguments for sdk/scripts/wine-test (the target is added from rust-target).
        type: string
        default: --locked --workspace
      audit:
        description: >-
          Run cargo audit and cargo deny check. Needs a deny.toml that allows
          the SDK's git source (start from the SDK's templates/deny.toml).
        type: boolean
        default: true
      sdk-check:
        description: Fail when sdk/ drifted from the SDK version in sdk/VERSION.
        type: boolean
        default: true
      sdk-dir:
        description: Where sdk-sync vendored the SDK.
        type: string
        default: sdk
      sdk-repository:
        description: The SDK repository sdk/VERSION refers to.
        type: string
        default: akitaonrails/rea-launcher-sdk
      extra-build:
        description: >-
          Commands (bash) run after the workspace release build, for what
          `cargo build --workspace` doesn't build: e.g. a dependency's DLL
          such as rea-launcher-close-hook (`cargo build --release --locked
          --target "$RUST_TARGET" -p rea-launcher-close-hook`). REA_RELEASE_DIR
          is the release output folder.
        type: string
        default: ""
      imports-check:
        description: >-
          For a Windows rust-target: check that the launcher's
          .cargo/config.toml links it with lld, and that every import of the
          built .exe/.dll files (the release folder, then every .exe/.dll in
          package-dir) belongs to an import descriptor
          (sdk/packaging/check-lld.sh, check-imports.sh). GNU ld 2.47
          mis-links both i686 and x86_64 builds.
        type: boolean
        default: true
      imports-test:
        description: >-
          Command run after the release build (e.g. an import-resolution
          test); REA_RELEASE_DIR is the release output folder.
        type: string
        default: ""
      package-command:
        description: >-
          Command that builds the packages (bash). REA_VERSION_NAME is the
          ref name with / as -, REA_RELEASE_DIR the release output folder,
          REA_CACHE a download cache, REA_SDK the vendored SDK folder.
        type: string
        default: ""
      package-dir:
        description: Glob of unpacked package folders (or zips) for the allowlist check.
        type: string
        default: ""
      package-allowlist:
        description: Allowlist file for sdk/packaging/smoke-package.sh.
        type: string
        default: ""
      artifact-name:
        description: Artifact to upload (empty uploads nothing).
        type: string
        default: ""
      artifact-paths:
        description: Newline-separated paths or globs for the artifact.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check, build and package
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    # Distinct from the caller's own concurrency group (sharing one would
    # deadlock); a newer push cancels an older run, never a tag build.
    concurrency:
      group: rea-launcher-ci-${{ github.repository }}-${{ github.ref }}-${{ inputs.concurrency-key }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    env:
      RUST_TARGET: ${{ inputs.rust-target }}
      SDK_DIR: ${{ inputs.sdk-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false

      - name: Read the vendored SDK version
        id: sdk
        if: inputs.sdk-check
        shell: sh
        run: |
          [ -f "$SDK_DIR/VERSION" ] || { echo "::error::no $SDK_DIR/VERSION: vendor the SDK with scripts/sdk-sync"; exit 1; }
          tag=$(sed -n 's/^tag=//p' "$SDK_DIR/VERSION")
          commit=$(sed -n 's/^commit=//p' "$SDK_DIR/VERSION")
          case $commit in *-dirty | unknown | '') echo "::error::$SDK_DIR was vendored from an uncommitted SDK ($commit)"; exit 1 ;; esac
          case $commit in *[!0-9a-f]*) echo "::error::bad commit in $SDK_DIR/VERSION"; exit 1 ;; esac
          case $tag in '' | *[!A-Za-z0-9._+-]*) echo "::error::bad tag in $SDK_DIR/VERSION"; exit 1 ;; esac
          ref=$tag
          if [ "$tag" = untagged ]; then ref=$commit; fi
          { echo "ref=$ref"; echo "tag=$tag"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"

      - name: Fetch that SDK version
        if: inputs.sdk-check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.sdk-repository }}
          ref: ${{ steps.sdk.outputs.ref }}
          path: .rea-sdk
          persist-credentials: false

      - name: The vendored SDK matches it
        if: inputs.sdk-check
        shell: sh
        env:
          SDK_TAG: ${{ steps.sdk.outputs.tag }}
          SDK_COMMIT: ${{ steps.sdk.outputs.commit }}
        run: |
          got=$(git -C .rea-sdk rev-parse HEAD)
          [ "$got" = "$SDK_COMMIT" ] || { echo "::error::SDK $SDK_TAG is $got now, $SDK_DIR/VERSION says $SDK_COMMIT"; exit 1; }
          sh .rea-sdk/scripts/sdk-sync --check --tag "$SDK_TAG" .
          rm -rf .rea-sdk

      - name: Install build tools
        shell: sh
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
          APT_I386: ${{ inputs.apt-i386 }}
        run: |
          case $APT_PACKAGES in *[!A-Za-z0-9.+:=\ -]*) echo "::error::unexpected characters in apt-packages"; exit 1 ;; esac
          if [ "$APT_I386" = true ]; then sudo dpkg --add-architecture i386; fi
          # A Windows target always links with lld, whatever the list says.
          case $RUST_TARGET in *-windows-gnu*) APT_PACKAGES="$APT_PACKAGES lld" ;; esac
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install Rust
        shell: sh
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          if [ -n "$RUST_TARGET" ]; then rustup target add "$RUST_TARGET"; fi
          rustc --version

      - name: Windows targets link with lld
        if: inputs.imports-check && inputs.rust-target != ''
        shell: sh
        run: |
          [ -f "$SDK_DIR/packaging/check-lld.sh" ] \
            || { echo "::error::no $SDK_DIR/packaging/check-lld.sh: re-run scripts/sdk-sync from a newer SDK, or pass imports-check: false"; exit 1; }
          sh "$SDK_DIR/packaging/check-lld.sh" "$RUST_TARGET" \
            || { echo "::error file=.cargo/config.toml::$RUST_TARGET must link with lld (GNU ld 2.47 mis-links Windows imports)"; exit 1; }

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Unit tests (host)
        run: cargo test --workspace --locked

      - name: Dependency advisories, licences and sources
        if: inputs.audit
        run: |
          if [ ! -f deny.toml ]; then
            echo "::error::audit is on but there is no deny.toml: copy the SDK's templates/deny.toml (it allows the SDK git source), or pass audit: false"
            exit 1
          fi
          cargo install --locked cargo-audit@0.22.1 cargo-deny@0.19.8
          cargo audit
          cargo deny check

      - name: Shell syntax
        shell: sh
        env:
          GLOBS: ${{ inputs.shell-syntax }}
        run: |
          n=0
          # Unquoted on purpose: split the list, expand each glob.
          for f in $GLOBS; do
            [ -f "$f" ] || continue
            sh -n "$f" || { echo "::error file=$f::sh -n failed"; exit 1; }
            echo "ok   $f"
            n=$((n + 1))
          done
          echo "$n script(s) checked"

      - name: Shell tests
        shell: sh
        env:
          GLOBS: ${{ inputs.shell-tests }}
          SKIP_PATTERNS: ${{ inputs.shell-tests-skip }}
        run: |
          for t in $GLOBS; do
            [ -f "$t" ] || continue
            skip=''
            set -f
            for pat in $SKIP_PATTERNS; do
              # shellcheck disable=SC2254 # a pattern on purpose
              case $t in $pat) skip=1 ;; esac
            done
            set +f
            if [ -n "$skip" ]; then echo "skip $t"; continue; fi
            echo "::group::$t"
            sh "$t" || { echo "::endgroup::"; echo "::error file=$t::$t failed"; exit 1; }
            echo "::endgroup::"
          done

      - name: Lint (release target)
        shell: sh
        env:
          CLIPPY_ARGS: ${{ inputs.clippy-args }}
        run: |
          case $CLIPPY_ARGS in *[!A-Za-z0-9_=,.:\ -]*) echo "::error::unexpected characters in clippy-args"; exit 1 ;; esac
          set -f
          # shellcheck disable=SC2086 # split the argument list on purpose
          set -- --release --workspace --locked $CLIPPY_ARGS
          set +f
          if [ -n "$RUST_TARGET" ]; then set -- "$@" --target "$RUST_TARGET"; fi
          cargo clippy "$@" -- -D warnings

      - name: Release build
        shell: sh
        run: |
          set -- --release --workspace --locked
          release=target/release
          if [ -n "$RUST_TARGET" ]; then set -- "$@" --target "$RUST_TARGET"; release=target/$RUST_TARGET/release; fi
          cargo build "$@"
          echo "REA_RELEASE_DIR=$PWD/$release" >> "$GITHUB_ENV"
          ref=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')
          case $ref in '' | *[!A-Za-z0-9._-]*) echo "::error::unexpected ref name"; exit 1 ;; esac
          echo "REA_VERSION_NAME=$ref" >> "$GITHUB_ENV"

      - name: Extra build
        if: inputs.extra-build != ''
        env:
          CMD: ${{ inputs.extra-build }}
        run: bash -euo pipefail -c "$CMD"

      - name: Every import resolves (built programs)
        if: inputs.imports-check && inputs.rust-target != ''
        shell: sh
        run: |
          case $RUST_TARGET in *-windows-gnu*) ;; *) echo "not a Windows target"; exit 0 ;; esac
          set --
          for f in "$REA_RELEASE_DIR"/*.exe "$REA_RELEASE_DIR"/*.dll; do
            if [ -f "$f" ]; then set -- "$@" "$f"; fi
          done
          [ $# -gt 0 ] || { echo "::error::no .exe or .dll in $REA_RELEASE_DIR"; exit 1; }
          sh "$SDK_DIR/packaging/check-imports.sh" "$@"

      - name: Install Wine for the Windows-target tests
        if: inputs.wine-tests
        shell: sh
        run: |
          case $RUST_TARGET in
            i686-pc-windows-gnu) mingw=gcc-mingw-w64-i686 ;;
            x86_64-pc-windows-gnu) mingw=gcc-mingw-w64-x86-64 ;;
            *) echo "::error::wine-tests needs rust-target i686-pc-windows-gnu or x86_64-pc-windows-gnu"; exit 1 ;;
          esac
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$mingw" lld wine wine32:i386 wine64

      - name: Windows-target tests under Wine (headless)
        if: inputs.wine-tests
        shell: sh
        env:
          WINE_TEST_ARGS: ${{ inputs.wine-test-args }}
        run: |
          case $WINE_TEST_ARGS in *[!A-Za-z0-9_=,.:/\ -]*) echo "::error::unexpected characters in wine-test-args"; exit 1 ;; esac
          [ -f "$SDK_DIR/scripts/wine-test" ] || { echo "::error::no $SDK_DIR/scripts/wine-test: re-run scripts/sdk-sync from SDK v0.2.0 or later"; exit 1; }
          set -f
          # shellcheck disable=SC2086 # split the argument list on purpose
          sh "$SDK_DIR/scripts/wine-test" --target "$RUST_TARGET" $WINE_TEST_ARGS

      - name: Imports test
        if: inputs.imports-test != ''
        env:
          CMD: ${{ inputs.imports-test }}
        run: bash -euo pipefail -c "$CMD"

      - name: Package
        if: inputs.package-command != ''
        env:
          CMD: ${{ inputs.package-command }}
          REA_CACHE: ${{ runner.temp }}/rea-cache
        run: |
          export REA_SDK="$PWD/$SDK_DIR"
          bash -euo pipefail -c "$CMD"

      - name: Every import resolves (packages)
        if: inputs.imports-check && inputs.rust-target != '' && inputs.package-dir != '' && inputs.package-command != ''
        shell: sh
        env:
          PACKAGES: ${{ inputs.package-dir }}
        run: |
          case $RUST_TARGET in *-windows-gnu*) ;; *) echo "not a Windows target"; exit 0 ;; esac
          list=$RUNNER_TEMP/rea-package-programs
          : > "$list"
          n=0
          for p in $PACKAGES; do
            [ -e "$p" ] || continue
            if [ -f "$p" ]; then
              n=$((n + 1)); dir=$RUNNER_TEMP/rea-package-$n
              rm -rf "$dir"; mkdir -p "$dir"
              unzip -q "$p" -d "$dir"
              p=$dir
            fi
            find "$p" -type f \( -name '*.[eE][xX][eE]' -o -name '*.[dD][lL][lL]' \) >> "$list"
          done
          [ -s "$list" ] || { echo "no .exe or .dll in $PACKAGES"; exit 0; }
          status=0
          while IFS= read -r f; do
            sh "$SDK_DIR/packaging/check-imports.sh" "$f" || status=1
          done < "$list"
          exit "$status"

      - name: Package allowlist
        if: inputs.package-allowlist != ''
        shell: sh
        env:
          ALLOWLIST: ${{ inputs.package-allowlist }}
          PACKAGES: ${{ inputs.package-dir }}
        run: |
          [ -n "$PACKAGES" ] || { echo "::error::package-allowlist needs package-dir"; exit 1; }
          n=0
          for p in $PACKAGES; do
            [ -e "$p" ] || continue
            sh "$SDK_DIR/packaging/smoke-package.sh" "$p" "$ALLOWLIST"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no package matches $PACKAGES"; exit 1; }

      - name: Upload the packages
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-paths }}
          if-no-files-found: error
