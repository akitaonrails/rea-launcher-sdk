name: mirror

# Reusable mirror of pinned third-party files into the calling repository's
# own GitHub release (tag `thirdparty` by default), so a build survives an
# upstream move or deletion. Generalised from CMR3's mirror.yml.
#
# Only pins marked with the word `mirror` (their licence allows
# republishing) are uploaded, each under the pin's file name (pins.sh
# pin_file: the primary url's basename), so the fallback url the pin lists,
# `pin_mirror_url <name>`, always names the uploaded asset. Every file is
# checked against its sha256 before upload. The release is never deleted:
# it is created only when missing, and assets are replaced with --clobber.
#
# Call it by hand after adopting a new pin (workflow_dispatch in the
# launcher); the calling job grants contents: write.

on:
  workflow_call:
    inputs:
      pins:
        description: Pin files to read, space-separated.
        type: string
        default: packaging/third-party.txt
      tag:
        description: Tag of the mirror release.
        type: string
        default: thirdparty
      sdk-dir:
        description: Where sdk-sync vendored the SDK.
        type: string
        default: sdk
      runs-on:
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  mirror:
    name: Refresh the mirror release
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PINS: ${{ inputs.pins }}
      TAG: ${{ inputs.tag }}
      SDK_DIR: ${{ inputs.sdk-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch and verify every mirrorable pin
        shell: sh
        run: |
          case $TAG in '' | *[!A-Za-z0-9._-]*) echo "::error::bad tag '$TAG'"; exit 1 ;; esac
          OUT=$RUNNER_TEMP/mirror
          . "$SDK_DIR/packaging/pins.sh"
          PIN_CACHE='' PIN_DIR='' PIN_MIRROR_REPO=$GITHUB_REPOSITORY PIN_MIRROR_TAG=$TAG
          mkdir -p "$OUT"
          : > "$RUNNER_TEMP/names"
          n=0
          set -f
          for PIN_FILE in $PINS; do
            set +f
            [ -f "$PIN_FILE" ] || { echo "::error::no pin file $PIN_FILE"; exit 1; }
            for name in $(pin_names); do
              pin_mirrorable "$name" || continue
              file=$(pin_file "$name")
              # Two pins must never share an asset name.
              if grep -qxF "$file" "$RUNNER_TEMP/names"; then
                echo "::error::$name: asset name $file is used by another pin"; exit 1
              fi
              echo "$file" >> "$RUNNER_TEMP/names"
              echo "::group::$name -> $file"
              got=$(pin_fetch "$name" "$OUT") || { echo "::error::$name: no source matched its sha256"; exit 1; }
              pin_verify "$got" "$(pin_sha "$name")"
              url=$(pin_mirror_url "$name")
              if ! pin_urls "$name" | grep -qxF "$url"; then
                echo "::warning file=$PIN_FILE::$name: add the mirror url as a fallback: $url"
              fi
              echo "::endgroup::"
              n=$((n + 1))
            done
          done
          [ "$n" -gt 0 ] || { echo "::error::no pin is marked mirror in $PINS"; exit 1; }
          ls -l "$OUT"

      - name: Upload to the mirror release
        shell: sh
        run: |
          OUT=$RUNNER_TEMP/mirror
          # Create once; never delete (a failed run must not leave the
          # fallback urls dead). Not "latest": the game's releases stay so.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "Validated third-party components" \
              --notes "Exact, checksum-verified copies of the pins marked mirror, kept so builds survive an upstream move or deletion. Refreshed by the mirror workflow."
          fi
          set -- "$OUT"/*
          gh release upload "$TAG" "$@" --repo "$GITHUB_REPOSITORY" --clobber
          echo "mirrored to $GITHUB_REPOSITORY@$TAG:"
          for f; do echo "  ${f##*/}"; done
