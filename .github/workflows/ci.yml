name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (host and i686 Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the 32-bit MinGW toolchain and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 lld
      - name: Install Rust (with the 32-bit Windows target)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add i686-pc-windows-gnu
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Unit tests (host)
        run: cargo test --workspace --locked
      - name: Lint (host)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint (i686 Windows)
        run: cargo clippy --workspace --all-targets --locked --target i686-pc-windows-gnu -- -D warnings
      - name: Build (i686 Windows)
        run: cargo build --workspace --locked --target i686-pc-windows-gnu

  shell:
    name: Shell and packaging (dash, mawk)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dash, mawk and the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dash mawk busybox curl xz-utils zip unzip
      - name: Shell syntax
        run: |
          for f in packaging/*.sh packaging/tests/*.sh scripts/sdk-sync scripts/tests/*.sh shell/*.sh shell/example-play shell/tests/*.sh; do
            [ -f "$f" ] || continue
            dash -n "$f" || { echo "::error file=$f::dash -n failed"; exit 1; }
            echo "ok   $f"
          done
      - name: Tests (dash, mawk as awk)
        run: |
          # Every script runs under dash with mawk first on the PATH as awk.
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(command -v mawk)" "$RUNNER_TEMP/bin/awk"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          for t in packaging/tests/*.sh scripts/tests/*.sh; do
            echo "::group::$t"
            dash "$t" || { echo "::endgroup::"; echo "::error file=$t::$t failed"; exit 1; }
            echo "::endgroup::"
          done
          # The play library's runner: every suite under sh, dash and busybox
          # (common.sh is its helper, not a test).
          echo "::group::shell/tests/run-all.sh"
          dash shell/tests/run-all.sh
          echo "::endgroup::"

  deny:
    name: Dependency advisories, licences and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit and cargo-deny (pinned)
        run: cargo install --locked cargo-audit@0.22.1 cargo-deny@0.19.8
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
